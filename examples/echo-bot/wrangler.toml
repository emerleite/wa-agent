name = "echo-bot"
main = "src/index.js"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "echo-bot"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# Apply the wa-agent framework migrations:
#   npm run db:migrate            # local (miniflare)
#   npm run db:migrate:remote     # production D1
#
# Or manually:
#   wrangler d1 migrations apply echo-bot --local --migrations-dir ../../migrations
