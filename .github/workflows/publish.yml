name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for --provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Reject anything that doesn't look like `vN.N.N[.suffix]` — the
          # tag-push trigger filter already limits to `v*.*.*`, but this
          # is defense in depth against a tag name with shell metachars.
          if ! printf '%s' "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Refusing to publish — tag name is not a valid semver form: $TAG_NAME"
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG_NAME (parsed as $TAG_VERSION) does not match package.json version $PKG_VERSION"
            echo "::error::Bump package.json to $TAG_VERSION or re-tag from a commit where they match"
            exit 1
          fi
          echo "OK — tag $TAG_NAME matches package.json version $PKG_VERSION"

      - name: Typecheck
        run: npm run typecheck

      - name: Hardcoded-URL linter
        run: npm run check:hardcoded

      - name: Build
        run: npm run build

      - name: Unit + integration tests
        run: npm test

      - name: Publish to npm with provenance
        run: npm publish --access=public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
